<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finaira — Admin Panel · Internal Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ═══════════════════════════════════════════════
   DESIGN TOKENS — Finaira shared system
═══════════════════════════════════════════════ */
:root {
  --n50:  #F7F8FA; --n100: #DADEE6; --n200: #A8B0BF;
  --n300: #98A1B3; --n400: #7A8499; --n500: #606B80;
  --n600: #475166; --n700: #323B4D; --n900: #1F2633;
  --p50:  #EFF6FF; --p600: #2563EB; --p700: #4F46E5;
  --s400: #22C55E; --s600: #16A34A;
  --w400: #EAB308; --w600: #CA8A04;
  --d400: #EF4444;
  --a400: #F97316; --a500: #EA580C;
  --purple: #A855F7; --indigo: #6366F1; --cyan: #06B6D4;
  --card: #FFFFFF; --page: #F7F8FA;
  --border: #DADEE6;
  --sh-sm: 0 1px 4px rgba(96,107,128,.05);
  --sh-md: 0 1px 5px rgba(96,107,128,.10);
  --sh-lg: 0 4px 32px rgba(96,107,128,.20);
  --r-sm:2px; --r-md:4px; --r-lg:6px; --r-xl:8px; --r-full:9999px;
  --nav-h: 72px; --sb-w: 220px;
  --dur-fast:150ms; --dur-norm:250ms; --dur-slow:400ms;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:var(--page);color:var(--n900);line-height:1.5;overflow:hidden;height:100vh;-webkit-font-smoothing:antialiased;}
button{cursor:pointer;border:none;background:none;font-family:inherit;}
a{text-decoration:none;color:inherit;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--n100);border-radius:3px;}

/* ═══════════════════════════════════════════════
   APP SHELL
═══════════════════════════════════════════════ */
.app{display:flex;height:100vh;overflow:hidden;}

/* ─── SIDEBAR ─────────────────────────────── */
.sidebar{width:var(--sb-w);min-width:var(--sb-w);background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;z-index:50;box-shadow:var(--sh-sm);flex-shrink:0;}
.sb-logo{height:var(--nav-h);display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--border);gap:10px;overflow:hidden;flex-shrink:0;}
.logo-mark{width:32px;height:32px;background:linear-gradient(135deg,#2563EB,#4F46E5);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 1px 4px rgba(37,99,235,.3);}
.logo-mark svg{width:16px;height:16px;fill:white;}
.logo-txt{font-size:18px;font-weight:800;color:var(--n900);white-space:nowrap;letter-spacing:-.4px;}
.logo-sub{font-size:10px;font-weight:500;color:var(--n400);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;}

/* Admin badge in sidebar */
.sb-admin-card{margin:12px 10px;background:linear-gradient(135deg,rgba(99,102,241,.07),rgba(37,99,235,.05));border:1px solid rgba(99,102,241,.2);border-radius:var(--r-xl);padding:10px 12px;}
.sb-admin-label{font-size:10px;font-weight:600;color:var(--n400);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px;}
.sb-admin-name{font-size:12px;font-weight:700;color:var(--n900);}
.sb-admin-role{font-size:11px;color:var(--n600);margin-top:4px;display:flex;align-items:center;gap:5px;}
.sb-admin-role::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--s400);flex-shrink:0;}

.sb-nav{flex:1;padding:8px 0;overflow-y:auto;overflow-x:hidden;}
.sb-section{font-size:11px;font-weight:600;color:var(--n300);text-transform:uppercase;letter-spacing:.08em;padding:8px 18px 3px;white-space:nowrap;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 18px;color:var(--n600);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background var(--dur-fast),color var(--dur-fast);position:relative;overflow:hidden;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{background:var(--n50);color:var(--n900);}
.nav-item.active{background:var(--p50);color:var(--p600);font-weight:600;}
.nav-item.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--p600);border-radius:0 2px 2px 0;}
.nav-ic{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.nav-ic svg{width:20px;height:20px;}
.nav-badge{margin-left:auto;background:var(--d400);color:white;font-size:11px;font-weight:700;padding:1px 6px;border-radius:var(--r-full);min-width:18px;text-align:center;}
.nav-badge.warn{background:var(--a400);}
.nav-badge.info{background:var(--p600);}
.sb-foot{padding:10px 0;border-top:1px solid var(--border);}

/* ─── MAIN ─────────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* ─── TOPNAV ────────────────────────────────── */
.topnav{height:var(--nav-h);background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:14px;flex-shrink:0;box-shadow:var(--sh-sm);z-index:40;}
.tn-title{font-size:16px;font-weight:600;color:var(--n900);}
.tn-sub{font-size:12px;color:var(--n400);}
.tn-sep{flex:1;}
.bell-btn{position:relative;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-lg);cursor:pointer;transition:background var(--dur-fast);color:var(--n500);border:none;background:none;}
.bell-btn:hover{background:var(--n50);color:var(--n700);}
.bell-btn svg{width:20px;height:20px;}
.bell-dot{position:absolute;top:7px;right:7px;width:8px;height:8px;background:var(--d400);border-radius:var(--r-full);border:2px solid var(--card);}
.user-av{width:34px;height:34px;border-radius:var(--r-full);background:linear-gradient(135deg,var(--indigo),var(--p700));display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;border:2px solid var(--border);}

/* ─── CONTENT ───────────────────────────────── */
.content{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:20px;}

/* ═══════════════════════════════════════════════
   SHARED COMPONENTS
═══════════════════════════════════════════════ */

/* Badges */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:var(--r-full);font-size:11px;font-weight:500;white-space:nowrap;}
.badge-green {background:rgba(34,197,94,.1);color:var(--s600);}
.badge-red   {background:rgba(239,68,68,.1);color:var(--d400);}
.badge-blue  {background:var(--p50);color:var(--p600);}
.badge-orange{background:rgba(249,115,22,.1);color:var(--a500);}
.badge-gray  {background:var(--n50);color:var(--n600);border:1px solid var(--border);}
.badge-purple{background:rgba(168,85,247,.1);color:var(--purple);}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--r-full);font-size:11px;font-weight:600;white-space:nowrap;}
.pill-dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;}
.pill-green  {background:rgba(34,197,94,.1);color:var(--s600);}
.pill-red    {background:rgba(239,68,68,.1);color:var(--d400);}
.pill-blue   {background:var(--p50);color:var(--p600);}
.pill-orange {background:rgba(249,115,22,.1);color:var(--a500);}
.pill-indigo {background:rgba(99,102,241,.1);color:var(--p700);}
.pill-gray   {background:var(--n50);color:var(--n600);border:1px solid var(--border);}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r-lg);font-size:13px;font-weight:600;cursor:pointer;transition:all var(--dur-fast);border:none;white-space:nowrap;}
.btn-primary{background:var(--p600);color:white;box-shadow:0 1px 4px rgba(37,99,235,.2);}
.btn-primary:hover{background:#1d4ed8;transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.35);}
.btn-secondary{background:var(--card);color:var(--n700);border:1px solid var(--border);}
.btn-secondary:hover{background:var(--n50);border-color:var(--n200);}
.btn-success{background:rgba(34,197,94,.1);color:var(--s600);border:1px solid rgba(34,197,94,.2);}
.btn-success:hover{background:rgba(34,197,94,.18);}
.btn-danger{background:rgba(239,68,68,.1);color:var(--d400);border:1px solid rgba(239,68,68,.2);}
.btn-danger:hover{background:rgba(239,68,68,.18);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-xs{padding:4px 9px;font-size:11.5px;}
.btn svg{width:15px;height:15px;}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--sh-sm);}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.card-title{font-size:15px;font-weight:600;color:var(--n900);display:flex;align-items:center;gap:7px;}
.card-title svg{width:17px;height:17px;color:var(--p600);}

/* Seat chips */
.seat-chips{display:flex;gap:4px;flex-wrap:wrap;}
.sc{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:var(--r-md);font-family:monospace;}
.sc-p {background:#dbeafe;color:#1e40af;}
.sc-ca{background:#dcfce7;color:#166534;}
.sc-s {background:#ffedd5;color:#9a3412;}

/* Health bar */
.hbar-wrap{display:flex;align-items:center;gap:8px;}
.hbar{height:5px;width:64px;background:var(--n100);border-radius:var(--r-sm);overflow:hidden;flex-shrink:0;}
.hbar-fill{height:100%;border-radius:var(--r-sm);}
.hbar-num{font-size:11.5px;font-family:monospace;color:var(--n400);}

/* ═══════════════════════════════════════════════
   METRIC CARDS
═══════════════════════════════════════════════ */
.metric-grid{display:grid;gap:14px;margin-bottom:0;}
.metric-grid-4{grid-template-columns:repeat(4,1fr);}
.metric-grid-3{grid-template-columns:repeat(3,1fr);}
.metric{background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);padding:18px 20px;box-shadow:var(--sh-sm);transition:box-shadow var(--dur-fast),transform var(--dur-fast);}
.metric:hover{box-shadow:var(--sh-md);transform:translateY(-1px);}
.metric-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.metric-label{font-size:12px;font-weight:500;color:var(--n400);}
.metric-ic{width:30px;height:30px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;}
.metric-ic svg{width:15px;height:15px;}
.metric-ic.p{background:var(--p50);color:var(--p600);}
.metric-ic.s{background:rgba(34,197,94,.1);color:var(--s600);}
.metric-ic.d{background:rgba(239,68,68,.1);color:var(--d400);}
.metric-ic.w{background:rgba(234,179,8,.1);color:var(--w600);}
.metric-ic.o{background:rgba(249,115,22,.1);color:var(--a500);}
.metric-value{font-size:26px;font-weight:700;color:var(--n900);line-height:1.1;margin-bottom:4px;}
.metric-value sub{font-size:13px;color:var(--n400);font-weight:400;}
.metric-footer{margin-top:6px;display:flex;align-items:center;gap:6px;}

/* ═══════════════════════════════════════════════
   TABLES
═══════════════════════════════════════════════ */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{padding:9px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--n400);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);background:var(--n50);white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--border);transition:background var(--dur-fast);}
tbody tr:hover{background:var(--p50);cursor:pointer;}
tbody tr:last-child{border-bottom:none;}
td{padding:11px 14px;color:var(--n700);vertical-align:middle;}
.td-sub{font-size:11.5px;color:var(--n400);}
.td-mono{font-family:monospace;font-size:11.5px;}
.row-actions{display:flex;gap:5px;opacity:0;transition:opacity var(--dur-fast);}
tbody tr:hover .row-actions{opacity:1;}

/* ═══════════════════════════════════════════════
   FILTERS BAR
═══════════════════════════════════════════════ */
.filters-bar{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.input-field{padding:7px 11px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);font-size:13px;color:var(--n900);font-family:'Inter',sans-serif;outline:none;transition:border-color var(--dur-fast),box-shadow var(--dur-fast);}
.input-field:focus{border-color:var(--p600);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
.input-search{width:230px;}
.input-select{cursor:pointer;min-width:120px;}
.date-input{padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);font-size:12px;color:var(--n900);font-family:'Inter',sans-serif;outline:none;transition:border-color var(--dur-fast);}
.date-input:focus{border-color:var(--p600);}

/* ═══════════════════════════════════════════════
   PAGINATION
═══════════════════════════════════════════════ */
.pagination{display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:14px 20px;border-top:1px solid var(--border);}
.pg-btn{min-width:32px;height:30px;padding:0 8px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--card);color:var(--n400);font-size:12px;cursor:pointer;transition:all var(--dur-fast);font-family:'Inter',sans-serif;}
.pg-btn:hover:not(:disabled):not(.active){background:var(--n50);color:var(--n700);}
.pg-btn.active{background:var(--p600);color:white;border-color:var(--p600);}
.pg-btn:disabled{opacity:.35;cursor:default;}

/* ═══════════════════════════════════════════════
   CHARTS
═══════════════════════════════════════════════ */
.charts-row{display:grid;grid-template-columns:1fr 320px;gap:14px;}
.chart-legend{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;}
.legend-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}

/* ═══════════════════════════════════════════════
   DETAIL PAGE
═══════════════════════════════════════════════ */
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--n400);cursor:pointer;border:none;background:none;font-family:'Inter',sans-serif;padding:0;margin-bottom:16px;transition:color var(--dur-fast);}
.back-btn:hover{color:var(--p600);}
.detail-grid{display:grid;grid-template-columns:380px 1fr;gap:14px;}
.info-row{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;gap:12px;}
.info-row:last-of-type{border-bottom:none;}
.info-key{color:var(--n400);font-weight:500;flex-shrink:0;}
.info-val{color:var(--n700);font-weight:600;text-align:right;}
.seat-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px;}
.seat-box{border-radius:var(--r-xl);padding:14px;text-align:center;}
.seat-box-num{font-size:22px;font-weight:700;font-family:monospace;line-height:1;}
.seat-box-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:5px;}
.seat-section{margin-bottom:20px;}
.seat-heading{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--n400);margin-bottom:10px;}
.user-list{display:flex;flex-direction:column;gap:2px;}
.user-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-lg);background:var(--n50);transition:background var(--dur-fast);}
.user-row:hover{background:var(--p50);}
.avatar{width:30px;height:30px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex-shrink:0;}
.av-blue  {background:#dbeafe;color:#1d4ed8;}
.av-green {background:#dcfce7;color:#15803d;}
.av-orange{background:#ffedd5;color:#c2410c;}
.user-name {font-size:12.5px;font-weight:600;color:var(--n700);}
.user-email{font-size:11px;color:var(--n400);}
.divider{border:none;border-top:1px solid var(--border);margin:20px 0;}

/* ═══════════════════════════════════════════════
   MODAL
═══════════════════════════════════════════════ */
.modal-overlay{position:fixed;inset:0;background:rgba(31,38,51,.5);z-index:300;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
.modal-overlay.open{display:flex;}
.modal{background:var(--card);border-radius:var(--r-xl);box-shadow:var(--sh-lg);width:500px;max-width:94%;border:1px solid var(--border);max-height:88vh;overflow-y:auto;animation:modal-in var(--dur-norm) ease;}
.modal-sm{width:380px;}
@keyframes modal-in{from{opacity:0;transform:translateY(-10px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal-header{margin-bottom:6px;}
.modal-title{font-size:16px;font-weight:700;color:var(--n900);}
.modal-sub{font-size:12.5px;color:var(--n400);margin-top:4px;margin-bottom:22px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border);}
.modal-inner{padding:24px;}

/* Forms */
.form-grid  {display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.form-group {display:flex;flex-direction:column;gap:6px;}
.form-group.full{grid-column:1 / -1;}
.form-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--n400);}
.form-input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);font-size:13px;color:var(--n900);font-family:'Inter',sans-serif;outline:none;transition:border-color var(--dur-fast),box-shadow var(--dur-fast);}
.form-input:focus{border-color:var(--p600);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
.form-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--n400);margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.form-err-banner{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:var(--d400);border-radius:var(--r-lg);padding:9px 14px;font-size:12.5px;margin-top:14px;display:none;}

/* Confirm modal */
.confirm-icon{width:48px;height:48px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 16px;}
.confirm-title{font-size:16px;font-weight:700;color:var(--n900);text-align:center;}
.confirm-body{font-size:12.5px;color:var(--n400);text-align:center;margin:8px 0 22px;}

/* Link box */
.link-box{background:var(--n50);border:1px solid var(--border);border-radius:var(--r-lg);padding:10px 14px;font-family:monospace;font-size:11px;color:var(--n500);word-break:break-all;margin:14px 0;}

/* ═══════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════ */
.toast-area{position:fixed;top:16px;right:20px;z-index:500;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{background:var(--n700);color:white;padding:11px 18px;border-radius:var(--r-xl);font-size:13px;font-weight:500;max-width:320px;pointer-events:all;box-shadow:var(--sh-lg);animation:toast-in var(--dur-norm) ease;display:flex;align-items:center;gap:9px;border-left:3px solid rgba(255,255,255,.2);}
.toast svg{width:16px;height:16px;flex-shrink:0;}
.toast.success{background:#15803d;border-left-color:#4ade80;}
.toast.error{background:#b91c1c;border-left-color:#f87171;}
@keyframes toast-in{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

/* ═══════════════════════════════════════════════
   EMPTY STATE
═══════════════════════════════════════════════ */
.empty-state{text-align:center;padding:44px 20px;color:var(--n400);font-size:13px;}
.empty-icon{font-size:32px;margin-bottom:12px;opacity:.5;}
.empty-label{font-weight:600;color:var(--n500);}
.empty-sub{font-size:12px;margin-top:4px;}

/* ═══════════════════════════════════════════════
   PAGE ANIMATION
═══════════════════════════════════════════════ */
.page{animation:fadein var(--dur-norm) ease;display:flex;flex-direction:column;gap:14px;}

  buildPie(cx, cy, r) {
    const plans = ['Trial','Basic','Pro','Enterprise'];
    const colors = ['#F97316','#2563EB','#22C55E','#A855F7'];
    const counts = plans.map(p => DATA.firms.filter(f => f.plan === p).length);
    const total = counts.reduce((a,b) => a+b, 0);
    let start = -Math.PI / 2;
    return counts.map((n, i) => {
      if (!n) return '';
      const angle = (n / total) * 2 * Math.PI;
      const x1 = cx + r * Math.cos(start), y1 = cy + r * Math.sin(start);
      const x2 = cx + r * Math.cos(start + angle), y2 = cy + r * Math.sin(start + angle);
      const lg = angle > Math.PI ? 1 : 0;
      const d = `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${lg},1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
      start += angle;
      return `<path d="${d}" fill="${colors[i]}" stroke="#fff" stroke-width="1.5"/>`;
    }).join('');
  },

  submitAddFirm() {
    const g = id => (document.getElementById(id)||{}).value?.trim() || '';
    const errs = [];
    if (!g('fn-name'))  errs.push('Firm name is required.');
    if (!g('fn-admin')) errs.push('Admin name is required.');
    if (!g('fn-email')) errs.push('Email is required.');
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(g('fn-email'))) errs.push('Enter a valid email address.');
    if (!g('fn-phone')) errs.push('Phone is required.');
    else if (!/^\d{10}$/.test(g('fn-phone'))) errs.push('Enter a valid 10-digit phone number.');
    if (!g('fn-gstin')) errs.push('GSTIN is required.');
    else if (g('fn-gstin').length !== 15) errs.push('GSTIN must be 15 characters.');
    if (!g('fn-plan'))  errs.push('Plan is required.');
    const p = parseInt(g('fn-p')||'0'), ca = parseInt(g('fn-ca')||'0'), s = parseInt(g('fn-s')||'0');
    if (p < 1 || ca < 1 || s < 1) errs.push('All seat counts must be at least 1.');

    const errEl = document.getElementById('fn-err');
    if (errs.length) {
      errEl.textContent = errs[0];
      errEl.style.display = 'block';
      return;
    }
    this.closeModal();
    const ts = Date.now();
    this.openModal(`
    <div class="modal-inner" style="text-align:center">
      <div style="font-size:36px;margin-bottom:12px">🎉</div>
      <div class="modal-title" style="margin-bottom:6px">Firm Created!</div>
      <div style="font-size:12.5px;color:var(--n400);margin-bottom:16px">Share this onboarding link with the firm admin.</div>
      <div class="link-box">https://app.finaira.in/onboarding/link/mock_${ts}</div>
      <div class="modal-actions" style="justify-content:center">
        <button class="btn btn-secondary" onclick="App.closeModal()">Close</button>
        <button class="btn btn-primary" onclick="navigator.clipboard.writeText('https://app.finaira.in/onboarding/link/mock_${ts}');App.toast('Onboarding link copied!','success')">Copy Link</button>
      </div>
    </div>`);
    this.toast('Firm created — onboarding link generated.', 'success');
  },

  },

  openResend(id) {
    const f = DATA.firms.find(x => x.id === id);
    this.toast(`Invitation resent to ${f.email}`, 'success');
  },

  /* ── Filter handlers ── */
  onFirmSearch(v)    { this.firmFilters.search = v; this.firmPage = 1; this.render(); },
  onFirmFilter(k, v) { this.firmFilters[k] = v; this.firmPage = 1; this.render(); },
  setFirmPage(p)     { this.firmPage = p; this.render(); document.getElementById('content').scrollTop = 0; },
  onAuditSearch(v)   { this.auditFilters.search = v; this.render(); },
  onAuditFilter(k,v) { this.auditFilters[k] = v; this.render(); },

  /* ── Modal ── */
  openModal(html, small = false) {
    const box = document.getElementById('modal-box');
    box.className = 'modal' + (small ? ' modal-sm' : '');
    box.innerHTML = html;
    document.getElementById('modal-overlay').classList.add('open');
  },
  closeModal(e) {
    if (!e || e.target === document.getElementById('modal-overlay')) {
      document.getElementById('modal-overlay').classList.remove('open');
    }
  },

  /* ── Toast ── */
  toast(msg, type = '') {
    const area = document.getElementById('toast-area');
    const t = document.createElement('div');
    t.className = 'toast' + (type ? ' ' + type : '');
    const icons = {
      success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>',
      error:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
    };
    t.innerHTML = (icons[type] || icons.success) + msg;
    area.appendChild(t);
    setTimeout(() => t.style.transition = 'opacity .3s', 2800);
    setTimeout(() => t.remove(), 3500);
  },

  /* ── Logout ── */
  logout() {
    this.toast('Logged out successfully.', 'success');
  },
};

/* ── Init ── */
App.go('dashboard');
</script>
</body>
</html>
