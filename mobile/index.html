A.tab = id => {
  if (id === 'more') { Sheet.id === 'more' ? Sheet.close() : openMore(); return; }
  const same = S.screen === id && !Nav.stack.length && !Sheet.id;
  if (same) {                                   // re-tapping the active tab scrolls to top
    const sc = $('#rootScreen .scroll'); if (sc) sc.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  Nav.go(id);
};
A.go = name => Nav.go(name);

const ROLES = [['admin', 'Partner'], ['junior', 'Associate'], ['staff', 'Team']];
const canSee = scr => !((scr === 'users' && S.role !== 'admin') || (scr === 'finances' && S.role !== 'admin'));

function moreRow(scr, icon, title, desc, badge = '') {
  const on = S.screen === scr;
  return `<button class="lrow ${on ? 'on' : ''}" onclick="A.go('${scr}')"><span class="tile ${on ? 'solid' : ''}">${ic(icon)}</span>
    <span class="grow"><span class="tt" style="display:block">${title}</span><span class="ds" style="display:block">${desc}</span></span>
    ${badge ? `<span class="count-pill">${badge}</span>` : ''}${ic('chevR', 'chev')}</button>`;
}
function moreBody() {
  const u = me();
  return `<button class="user-card" style="width:100%;text-align:left;" aria-label="Account and sign out" onclick="A.openAccount()">${avatar(u, 'lg')}<div class="grow"><div class="bold trunc">${u.name}</div><div class="xs muted trunc">${S.firm.name}</div></div><span class="badge primary">${ROLE_LABEL[S.role]}</span>${ic('chevR', 'chev')}</button>
  <div class="group-label" style="margin-top:14px;">Viewing the demo as</div>
  <div class="seg" id="roleSeg">${ROLES.map(([k, l]) => `<button class="${S.role === k ? 'active' : ''}" onclick="A.setRole('${k}')">${l}</button>`).join('')}</div>
  <div class="group-label">Workspace</div>
  <div class="group">
    ${moreRow('circulars', 'book', 'Knowledgebase', 'Circulars, notifications & case laws', S.badges.kb > 0 ? S.badges.kb : '')}
    ${canSee('finances') ? moreRow('finances', 'rupee', 'Finances', 'Revenue, invoices & collections') : ''}
    ${canSee('users') ? moreRow('users', 'users', 'User Management', 'Roles, workload & seats') : ''}
  </div>
  <div class="group-label">General</div>
  <div class="group">
    ${moreRow('settings', 'settings', 'Settings', 'Firm, billing & workflow')}
    ${moreRow('help', 'help', 'Help & Support', 'Tips, release notes & contact')}
  </div>`;
}
function openMore() { Sheet.open({ id: 'more', title: 'More', sub: 'Everything else in Finaira', body: moreBody(), size: 'more' }); }

A.setRole = role => {
  if (S.role === role) return;
  S.role = role;
  $('#phone').dataset.role = role;
  if (!canSee(S.screen)) { S.screen = 'dashboard'; }
  renderRoot(false); Nav.stack.forEach(p => { p.el.innerHTML = p.el._r(); });
  Sheet.setBody(moreBody());
  updateChrome();
  toast(`Now viewing as ${ROLE_LABEL[role]} — ${me().name}`, { icon: 'user' });
};

/* ═══════════════════════════════════════════════
   ACCOUNT  /  SIGN OUT
═══════════════════════════════════════════════ */
A.openAccount = () => {
  const u = me();
  Sheet.open({
    title: 'Account', body: `
    <div class="user-card" style="padding:16px;">${avatar(u, 'lg')}<div class="grow"><div class="bold">${u.name}</div><div class="xs muted">${u.email}</div></div></div>
    <div class="group" style="margin-top:12px;">
      <div class="kv"><span class="k">Role</span><span class="v">${u.role}</span></div>
      <div class="kv"><span class="k">Firm</span><span class="v">${S.firm.name}</span></div>
      <div class="kv"><span class="k">Mobile</span><span class="v">${u.mobile}</span></div>
      <div class="kv"><span class="k">Member since</span><span class="v">${u.joined}</span></div></div>
    <div class="group" style="margin-top:12px;">
      <button class="lrow" onclick="Sheet.close(true);A.go('settings');A.openSettings('notifs')"><span class="tile">${ic('bell')}</span><span class="grow tt">Notification preferences</span>${ic('chevR', 'chev')}</button>
      <button class="lrow" onclick="A.signOut()"><span class="tile danger">${ic('logout')}</span><span class="grow tt" style="color:#C25555">Sign out</span></button></div>`
  });
};
A.signOut = () => { Sheet.close(true); $('#signout').classList.add('show'); };
A.logBackIn = () => { $('#signout').classList.remove('show'); toast(`Welcome back, ${me().name.split(' ')[0]}`, { icon: 'user' }); };

/* ═══════════════════════════════════════════════
   NOTIFICATIONS
═══════════════════════════════════════════════ */
const notifRows = () => S.notifs.map(n => `<button class="lrow nrow ${n.unread ? 'unread' : ''}" onclick="A.openNotif('${n.id}')">
    <span class="tile t-${n.tone}">${ic(n.ic)}</span>
    <span class="grow"><span class="tt" style="display:block;font-size:13.5px;">${n.title}</span><span class="ds" style="display:block;line-height:1.4;">${n.body}</span></span>
    <span class="xs muted" style="align-self:flex-start;white-space:nowrap;">${n.time}</span></button>`).join('');
A.openNotifs = () => {
  const unread = S.notifs.filter(n => n.unread).length;

const SEARCH_NAV = [['dashboard', 'Dashboard', 'grid'], ['inbox', 'Inbox', 'mail'], ['triage', 'Tasks', 'tasks'], ['clients', 'Clients', 'users'], ['circulars', 'Knowledgebase', 'book'], ['finances', 'Finances', 'rupee'], ['users', 'User Management', 'users'], ['settings', 'Settings', 'settings'], ['help', 'Help & Support', 'help']];
function searchIndex() {
  const items = [];
  items.push({ g: 'Actions', l: 'Create new task', s: 'Action', i: 'plus', k: 'create new task add', run: () => A.newTask() });
  items.push({ g: 'Actions', l: 'Add client', s: 'Action', i: 'userPlus', k: 'add new client', run: () => { A.go('clients'); setTimeout(A.addClient, 120); } });
  SEARCH_NAV.filter(([k]) => canSee(k)).forEach(([k, l, i]) => items.push({ g: 'Go to', l, s: 'Screen', i, k: l, run: () => A.go(k) }));
  CLIENTS.forEach(c => items.push({ g: 'Clients', l: c.name, s: `${c.industry} · ${c.cid}`, i: 'bldg', k: [c.name, c.gstin, c.pan, c.industry, c.cid].join(' '), run: () => A.openClient(c.id) }));
  visibleTasks().forEach(t => items.push({ g: 'Tasks', l: t.short, s: `${t.code} · ${cap(t.pri)} · ${clientShort(C(t.client))}`, i: 'tasks', k: [t.title, t.code, t.cat].join(' '), run: () => openTaskLink(t.id) }));
  MSGS.forEach(m => items.push({ g: 'Inbox', l: m.name || m.person, s: (m.prev || '').slice(0, 52) + '…', i: srcIcon(m.src), k: [m.name, m.person, m.prev].join(' '), run: () => A.openMsg(m.id) }));
  if (canSee('finances')) INVOICES.forEach(v => items.push({ g: 'Invoices', l: v.id, s: `${clientShort(C(v.cid))} · ${v.service}`, i: 'file', k: [v.id, C(v.cid).name, v.service].join(' '), run: () => A.openInvoice(v.id) }));
  Object.entries(KB).forEach(([tab, arr]) => arr.forEach(x => items.push({ g: 'Knowledgebase', l: x.title, s: cap(tab.replace('caselaws', 'case law')), i: 'book', k: x.title + ' ' + (x.tag || ''), run: () => A.openKB(x.id) })));
  Object.values(NOTICES).forEach(n => items.push({ g: 'Notices', l: n.short, s: `${clientShort(C(n.client))} · ${n.issuer}`, i: 'alertT', k: n.title + ' ' + n.short, run: () => A.openNotice(n.id) }));
  return items;
}
function searchResults(q) {
  const all = searchIndex(), ql = q.trim().toLowerCase();
  S._res = ql ? all.filter(x => (x.l + ' ' + x.k).toLowerCase().includes(ql)) : all.filter(x => x.g === 'Actions' || (x.g === 'Go to' && ['Inbox', 'Tasks', 'Clients', 'Knowledgebase'].includes(x.l)));
  if (!S._res.length) return empty('search', `No results for “${esc(q)}”`);
  const groups = {};
  S._res.forEach((x, i) => { x.i_ = i; (groups[x.g] = groups[x.g] || []).push(x); });
  return Object.entries(groups).map(([g, xs]) => `<div class="res-group"><div class="res-label">${g}</div>${xs.slice(0, ql ? 5 : 8).map(x => `<button class="res" onclick="A.runRes(${x.i_})"><span class="rt">${ic(x.i)}</span><span class="grow" style="min-width:0;"><span class="rl trunc" style="display:block">${esc(x.l)}</span><span class="rs trunc" style="display:block">${esc(x.s)}</span></span>${ic('chevR', 'chev')}</button>`).join('')}</div>`).join('');
}

A.runRes = i => { const x = S._res[i]; if (!x) return; Sheet.close(true); x.run(); };

const AI_REPLIES = {
  create: { t: 'Sure! Let me start a new task. Which client is this for, and what type of filing?', chips: [['Open new-task form', 'A.newTask()']] },
  mehta: { t: '**Mehta Industries** has 3 active critical tasks:\n1. GSTR-9 Annual Return — due Mar 31\n2. ITC Mismatch Resolution — due Mar 28\n3. GST SCN Response — due Apr 2\n\nWould you like to open any of these?', chips: [['GSTR-9', "openTaskLink('t1')"], ['ITC Mismatch', "openTaskLink('t8')"], ['GST SCN', "openTaskLink('tn1')"]] },
  gstr: { t: 'The **GSTR-9** for Mehta Industries is **In Progress**, assigned to Priya Kumar. Due in 6 days (Mar 31). Estimated penalty if missed: ₹2.5L. Want me to open the task detail?', chips: [['Open task', "openTaskLink('t1')"]] },
  critical: { t: 'You have **5 critical tasks** due this week:\n• GSTR-9 — Mehta Industries (Mar 31)\n• TDS Q3 — Verma Textiles (Mar 30)\n• GST SCN — Mehta Industries (Apr 2)\n• ITC Mismatch — Mehta Industries (Mar 28)\n• Advance Tax — Sharma Exports (Mar 31)', chips: [['View in Tasks', "A.tab('triage')"]] },
  deadline: { t: '**Upcoming deadlines this week:**\n• Mar 30 — TDS Q3, Verma Textiles\n• Mar 31 — GSTR-9, Mehta Industries\n• Mar 31 — Advance Tax, Sharma Exports\n• Apr 2 — GST SCN Response, Mehta\n\nTotal penalty exposure: ₹8.4L', chips: [['View in Tasks', "A.tab('triage')"]] },
  fallback: { t: 'Got it! I can help you with that. To give you the most accurate answer, could you specify the client name or task type?' },
};
const aiReplyFor = msg => {
  const l = msg.toLowerCase();
  if (/create|new task|add task/.test(l)) return AI_REPLIES.create;
  if (l.includes('mehta') && /status|task|client/.test(l)) return AI_REPLIES.mehta;
  if (/gstr|annual return/.test(l)) return AI_REPLIES.gstr;
  if (l.includes('critical')) return AI_REPLIES.critical;
  if (/deadline|due|upcoming/.test(l)) return AI_REPLIES.deadline;
  return AI_REPLIES.fallback;
};
const aiFmt = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const aiBubble = m => `<div class="ai-msg ${m.who}">${aiFmt(m.t)}${m.chips ? `<div class="refine ai-chips">${m.chips.map(([l, js]) => `<button onclick="Sheet.close(true);${js}">${l}</button>`).join('')}</div>` : ''}</div>`;
const aiSugs = () => S.chat.length > 1 ? '' : `<div class="sugs" id="aiSugs">${[['+ New task', 'Create a new task for Mehta Industries'], ['Critical tasks', 'Show critical tasks due this week'], ['Task status', 'What is the status of GSTR-9 for Mehta?'], ['Deadlines', 'Which clients have upcoming deadlines?']].map(([l, q]) => `<button class="sug" onclick="A.aiSend('${q}')">${l}</button>`).join('')}</div>`;

A.openAI = () => {
  if (!S.chat.length) S.chat.push({ who: 'bot', t: "Hi! I'm your **Finaira AI** assistant. I can help you **create tasks**, **look up clients**, or **answer questions** about any matter. What would you like to do?" });
  S._aiMode = 'chat';
  Sheet.open({
    id: 'ai', noHead: true, size: 'tall chat',
    body: `<div class="ai-head" data-drag><span class="fph-icon">${ic('zap')}</span><div class="grow"><div class="fph-title">Finaira AI Assistant</div><div class="fph-sub">Create tasks · Ask about clients · Attach docs</div></div><button class="sheet-x" aria-label="Close" onclick="Sheet.close()">${ic('x')}</button></div>
      <div class="ai-modes" id="aiModes" role="tablist"><button class="active" role="tab" aria-selected="true" onclick="A.aiMode('chat')">${ic('msg')}Chat</button><button role="tab" aria-selected="false" onclick="A.aiMode('voice')">${ic('mic')}Voice</button></div>
      <div class="ai-pane" id="aiPane">${aiChatPane()}</div>`,
    onOpen: () => { const m = $('#aiMsgs'); if (m) m.scrollTop = m.scrollHeight; }
  });
};
const aiChatPane = () => `<div class="ai-msgs" id="aiMsgs">${S.chat.map(aiBubble).join('')}</div>${aiSugs()}
  <div class="composer"><label class="round-btn ghost" aria-label="Attach document">${ic('clip')}<input type="file" hidden onchange="A.aiAttach(event)"/></label>
  <input class="input" id="aiInput" placeholder="Ask Finaira AI…" aria-label="Ask anything or type a command" autocomplete="off" onkeydown="if(event.key==='Enter')A.aiSendInput()"/><button class="round-btn" aria-label="Send" onclick="A.aiSendInput()">${ic('send')}</button></div>`;
const aiVoicePane = () => `<div class="voice-pane"><button class="mic" id="aiMic" aria-label="Tap to speak" onclick="A.aiListen()">${ic('mic')}</button>
  <div><div class="bold" id="aiVoiceHint">Tap to speak</div><div class="xs muted" style="margin-top:4px;">Try “Show me all critical tasks for this week”</div></div>
  <div class="wave" id="aiWave" style="visibility:hidden"><i></i><i></i><i></i><i></i><i></i></div>
  <label class="btn btn-secondary" style="cursor:pointer;">${ic('clip')}Attach document<input type="file" hidden onchange="A.aiAttach(event)"/></label></div>`;

A.aiMode = mode => {
  S._aiMode = mode; S._aiListening = false;
  $$('#aiModes button').forEach((b, i) => { const on = (i === 0) === (mode === 'chat'); b.classList.toggle('active', on); b.setAttribute('aria-selected', on); });
  $('#aiPane').innerHTML = mode === 'chat' ? aiChatPane() : aiVoicePane();
  if (mode === 'chat') { const m = $('#aiMsgs'); m.scrollTop = m.scrollHeight; }
};
function aiPush(msg) {
  S.chat.push(msg);
  const box = $('#aiMsgs'); if (!box) return;
  box.insertAdjacentHTML('beforeend', aiBubble(msg)); box.scrollTop = box.scrollHeight;
  const sg = $('#aiSugs'); if (sg && S.chat.length > 1) sg.remove();
}
A.aiSend = async text => {
  text = text.trim(); if (!text) return;
  aiPush({ who: 'user', t: text });
  const box = $('#aiMsgs');
  if (box) { box.insertAdjacentHTML('beforeend', '<div class="ai-msg bot" id="aiTyping"><span class="typing"><i></i><i></i><i></i></span></div>'); box.scrollTop = box.scrollHeight; }
  await wait(850);
  const t = $('#aiTyping'); if (t) t.remove();
  const r = aiReplyFor(text);
  aiPush({ who: 'bot', t: r.t, chips: r.chips });
};
A.aiSendInput = () => { const i = $('#aiInput'); if (!i || !i.value.trim()) return; const v = i.value; i.value = ''; A.aiSend(v); };
A.aiAttach = e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  if (S._aiMode !== 'chat') A.aiMode('chat');
  aiPush({ who: 'user', t: `📎 Attached: **${f.name}**` });
  setTimeout(() => aiPush({ who: 'bot', t: `I've received **${f.name}**. I can extract data from this document, match it against existing tasks, or use it to create a new task. What would you like me to do?` }), 600);
};
A.aiListen = () => {
  const mic = $('#aiMic'); if (!mic) return;
  if (S._aiListening) { S._aiListening = false; mic.classList.remove('live'); $('#aiWave').style.visibility = 'hidden'; $('#aiVoiceHint').textContent = 'Tap to speak'; return; }
  S._aiListening = true; mic.classList.add('live'); $('#aiWave').style.visibility = 'visible'; $('#aiVoiceHint').textContent = 'Listening… speak now';
  setTimeout(() => {
    if (!S._aiListening || Sheet.id !== 'ai') return;
    S._aiListening = false; A.aiMode('chat');
    setTimeout(() => A.aiSend('Show me all critical tasks for this week'), 250);
  }, 3200);
};

const DEMO_TODAY = new Date(2026, 2, 25);            // the demo data is set on 25 Mar 2026 (same as desktop)
const CATS = [['GST', 'GST'], ['TDS', 'TDS'], ['Income Tax', 'Income Tax'], ['MCA', 'MCA / ROC'], ['Labour', 'Labour'], ['Notice', 'Notice Response'], ['Other', 'Other']];
const CAT_FEE = { 'GST': 12500, 'TDS': 8000, 'Income Tax': 15000, 'MCA': 10000, 'Notice': 20000, 'Labour': 5000, 'Other': 5000 };
const FYS = ['FY 2025–26', 'FY 2024–25', 'FY 2023–24'];
const COD = { critical: 150000, high: 60000, medium: 25000, low: 5000 };   // default "cost of delay" by priority
const pad2 = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
function dueFields(iso) {
  const d = new Date(iso + 'T00:00:00'); if (isNaN(d)) return {};
  const diff = Math.round((d - DEMO_TODAY) / 864e5);
  return {
    due: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
    dueFull: d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }),
    days: diff <= 0 ? '0d' : diff < 60 ? diff + 'd' : Math.round(diff / 30) + 'm',
  };
}
const yesNo = (id, val, yes = 'Yes', no = 'No', cls = '') => `<div class="yn ${cls}" id="${id}" data-v="${val ? 1 : 0}"><button class="${val ? 'yes' : ''}" onclick="A.yn('${id}',true)">${yes}</button><button class="${!val ? 'no' : ''}" onclick="A.yn('${id}',false)">${no}</button></div>`;
A.yn = (id, val) => {
  const el = $('#' + id); el.dataset.v = val ? '1' : '0';

  if (id === 'nt-chg') A.ntFee();

const num = id => Math.max(0, parseFloat($('#' + id).value) || 0);
A.ctDisc = from => {
  const fx = num('ct-fixed');
  if (from === 'flat') { const f = num('ct-dflat'); $('#ct-dpct').value = fx && f ? (f / fx * 100).toFixed(1).replace(/\.0$/, '') : ''; }
  else { const p = num('ct-dpct'); $('#ct-dflat').value = fx && p ? Math.round(fx * p / 100) : ''; }
  A.ctCalc();
};
function ctNumbers() {
  const fixed = num('ct-fixed'), v = num('ct-var'), e = num('ct-exp'), disc = Math.min(fixed, num('ct-dflat'));
  const gst = ynVal('ct-gst') ? Math.round((fixed - disc + v) * 0.18) : 0;
  return { fixed, v, e, disc, gst, total: fixed - disc + v + e + gst };
}
A.ctCalc = () => {
  const n = ctNumbers();
  const row = (k, v, cls = '') => `<div class="br"><span>${k}</span><b class="${cls}">${v}</b></div>`;
  $('#ct-sum').innerHTML = `<div class="bt">${ic('rupee')}Billing on closure</div>
    ${row('Fixed fee', inr(n.fixed), 'fee')}
    ${n.disc ? row('Discount', '− ' + inr(n.disc)) : ''}${n.v ? row('Variable cost', inr(n.v)) : ''}${n.e ? row('Expenses', inr(n.e)) : ''}${n.gst ? row('GST @ 18%', inr(n.gst)) : ''}
    <div class="bill-total"><span>Total Billable</span><b>${inr(n.total)}</b></div>`;
};
A.ctConfirm = id => {
  const u = $('#ct-udin');
  if (u && u.value.trim().length < 8) return invalid(u, 'Enter the UDIN generated for this engagement');
  if (u) T(id).udinNo = u.value.trim().toUpperCase();
  const n = ctNumbers(); A.confirmClose(id, n.v, n.e, n.total, n.fixed);
};
A.confirmClose = (id, variable, expense, total, fixed) => {
  const t = T(id);
  if (t.chg && fixed != null) t.fee = fixed;
  t.closed = { variable, expense, total: t.chg ? total : 0 };
  t.status = 'Completed';
  S.badges.triage = Math.max(0, S.badges.triage - 1);
  Sheet.close(); refresh();
  toast(t.chg ? `Task completed — ${inr(total)} ready to invoice` : 'Task marked complete');
};

function init() {
  fitPhone();
  $('#splashLogo').src = LOGO;
  $('#fab').innerHTML = ic('zap');
  $('#soIcon').innerHTML = ic('logout');
  renderRoot(false);
  updateChrome();
  setTimeout(() => $('#splash').classList.add('hide'), 1250);
}
init();
</script>
